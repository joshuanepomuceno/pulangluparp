name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest commit into the cPanel-hosted clone
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Git/update?repository_root=${{ secrets.CPANEL_REPO_PATH }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" != "200" ] || ! echo "$body" | grep -q '"status":1'; then
            echo "::error::cPanel Git/update failed (HTTP $http_code)"
            exit 1
          fi

      - name: Deploy HEAD commit (runs .cpanel.yml on the server)
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Git/deploy?repository_root=${{ secrets.CPANEL_REPO_PATH }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" != "200" ] || ! echo "$body" | grep -q '"status":1'; then
            echo "::error::cPanel Git/deploy failed (HTTP $http_code)"
            exit 1
          fi
